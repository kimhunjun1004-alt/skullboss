            -minion.facing
          );
        }
        drawBossSpear();
        drawBoss();
        drawBossPatternTwo();
        drawPattern6();
        drawPlayer();
        const blocks = Math.floor(player.x / BLOCK);
        const status = player.dashElapsed > 0
          ? 2
          : player.slowElapsed > 0 && player.grounded
            ? 3
            : player.hitElapsed > 0
              ? 1
              : 0;
        const monsterStatus = monster.permanentlyDefeated
          ? `몬스터 처치 ${monstersDefeated}/3`
          : monster.dead
            ? `재등장 ${monster.respawnElapsed.toFixed(1)}초 · 처치 ${monstersDefeated}/3`
            : `몬스터 HP ${monster.hp}/${MONSTER_MAX_HP} · 처치 ${monstersDefeated}/3`;
        const bossStatus = !boss.active
          ? "보스 대기"
          : boss.defeated
            ? "보스 격파"
            : `보스 ${boss.phase}P ${boss.hp}/${boss.maxHp}`;
        readout.textContent = `상태 ${status} · ${blocks.toLocaleString("ko-KR")} / ${MAP_BLOCKS} 블럭 · 플레이어 HP ${player.hp}/${PLAYER_MAX_HP} · 방어 HP ${player.defenseHp.toFixed(1)}/${PLAYER_MAX_DEFENSE_HP} · ${monsterStatus} · ${bossStatus}`;
      }

      function restartGame() {
        clearInputKeys();
        bossMusic.pause();
        bossMusic.currentTime = 0;
        activeTouchPointers.clear();
        joystickPointerId = null;
        joystickDirection = "";
        joystickStick.style.transform = "translate(-50%, -50%)";
        touchControls.querySelectorAll(".is-pressed").forEach((button) => {
          button.classList.remove("is-pressed");
        });
        gameOver = false;
        gameOverOverlay.hidden = true;
        player.hp = PLAYER_MAX_HP;
        player.defenseHp = PLAYER_MAX_DEFENSE_HP;
        player.defenseElapsed = PLAYER_PARRY_WINDOW;
        player.defenseEffectElapsed = PLAYER_DEFENSE_EFFECT_DURATION;
        player.defenseBreakElapsed = 0;
        player.defenseBreakSoundPlayed = false;
        player.parryUsed = false;
        bossParryStreak = 0;
        bossParryStunElapsed = 0;
        bossParryStunBlinkElapsed = 0;
        bossParryMinions = [];
        player.x = Math.max(0, viewWidth / 2 - player.width / 2);
        player.y = floorY() - player.height;
        player.vx = 0;
        player.vy = 0;
        player.facing = 1;
        player.grounded = true;
        player.dropThroughElapsed = 0;
        player.dashElapsed = 0;
        player.dashActiveThisFrame = false;
        player.dashHitbox = null;
        player.dashStartX = player.x;
        player.dashDirection = 1;
        player.dashEffectElapsed = 0;
        player.dashEffectX = player.x;
        player.dashEffectGroundY = player.y + player.height;
        player.slowElapsed = 0;
        player.slowMovementElapsed = 0;
        player.slowBurstCount = 0;
        player.slowEffects = [];
        player.hitStopElapsed = 0;
        player.hitElapsed = 0;
        player.hitPhase = "";
        player.hitPhaseElapsed = 0;
        player.hitStartX = 0;
        player.hitTargetX = 0;
        player.hitDirection = 0;
        player.shakeOffsetX = 0;
        player.dashCooldown = 0;
        player.dashInvulnerabilityElapsed = 0;
        monster.x = monster.spawnX;
        monster.y = monster.spawnY;
        monster.facing = monster.spawnFacing;
        monster.hp = MONSTER_MAX_HP;
        monster.dead = false;
        monster.permanentlyDefeated = false;
        monster.deathElapsed = 0;
        monster.respawnElapsed = 0;
        monster.mode = "approach";
        monster.modeElapsed = 0;
        monster.attackCooldown = 0.5;
        monster.meleeWindupElapsed = 0;
        monster.meleeElapsed = 0;
        monster.meleeCooldown = 0;
        monster.hitElapsed = 0;
        monster.hitPhase = "";
        monster.hitPhaseElapsed = 0;
        monster.hitStartX = 0;
        monster.hitTargetX = 0;
        monster.hitDirection = 1;
        monster.shakeOffsetX = 0;
        monster.pendingHitElapsed = 0;
        monster.pendingHitDirection = 1;
        monster.boneThrown = false;
        monster.projectiles = [];
        monstersDefeated = 0;
        resetBoss();
        pattern6 = null;
        cameraX = Math.max(
          0,
          Math.min(WORLD_WIDTH - viewWidth, player.x + player.width / 2 - viewWidth / 2)
        );
        previousTime = 0;
        draw();
      }

      function frame(time) {
        if (gameStarted) {
          const delta = previousTime ? Math.min((time - previousTime) / 1000, 0.04) : 0;
          previousTime = time;
          if (!gameOver) update(delta);
          draw();
        }
        requestAnimationFrame(frame);
      }

      window.addEventListener("keydown", (event) => {
        if (["ArrowLeft", "ArrowRight", "ArrowUp", "ArrowDown", " "].includes(event.key)) {
          event.preventDefault();
        }
        if (!gameStarted || gameOver) return;
        if (event.repeat) return;
        if (event.key.toLowerCase() === "r") {
          enterBossFight();
          return;
        }
        if ((event.key === "x" || event.key === "X")
          && (player.defenseBreakElapsed > 0 || player.defenseHp <= 0)) return;
        pressInputKey(event.key, "keyboard");
        if (event.key === "ArrowUp") jump();
        if (event.key === "ArrowDown") dropThroughPlatform();
        if (event.key.toLowerCase() === "z") startDash();
        if (event.key === "x" || event.key === "X") {
          player.defenseElapsed = 0;
          player.parryUsed = false;
          player.defenseEffectElapsed = 0;
        }
        if (event.key.toLowerCase() === "t") startPattern6();
      });

      modeSelection.querySelectorAll("[data-game-mode]").forEach((button) => {
        button.addEventListener("click", () => startGame(button.dataset.gameMode));
      });

      window.addEventListener("keyup", (event) => releaseInputKey(event.key, "keyboard"));
      function startTouchAction(action) {
        if (action === "dash") startDash();
        if (action === "defense") {
          if (player.defenseBreakElapsed > 0 || player.defenseHp <= 0) return;
          if (!isDefenseHeld()) {
            player.defenseElapsed = 0;
            player.parryUsed = false;
            player.defenseEffectElapsed = 0;
          }
          pressInputKey("x", "touch");
        }
      }

      function setJoystickDirection(direction) {
        if (direction === joystickDirection) return;
        if (joystickDirection === "left") releaseInputKey("ArrowLeft", "touch");
        if (joystickDirection === "right") releaseInputKey("ArrowRight", "touch");
        joystickDirection = direction;
        if (direction === "left") pressInputKey("ArrowLeft", "touch");
        if (direction === "right") pressInputKey("ArrowRight", "touch");
        if (direction === "up") jump();
        if (direction === "down") dropThroughPlatform();
      }

      function updateJoystick(event) {
        const bounds = joystick.getBoundingClientRect();
        const centerX = bounds.left + bounds.width / 2;
        const centerY = bounds.top + bounds.height / 2;
        const rawX = event.clientX - centerX;
        const rawY = event.clientY - centerY;
        const distance = Math.hypot(rawX, rawY);
        const offsetScale = distance > JOYSTICK_MAX_OFFSET
          ? JOYSTICK_MAX_OFFSET / distance
          : 1;
        const offsetX = rawX * offsetScale;
        const offsetY = rawY * offsetScale;
        joystickStick.style.transform = `translate(calc(-50% + ${offsetX}px), calc(-50% + ${offsetY}px))`;

        if (distance < JOYSTICK_ACTIVATION_OFFSET) {
          setJoystickDirection("");
          return;
        }
        if (Math.abs(rawY) > Math.abs(rawX) * 1.15) {
          setJoystickDirection(rawY < 0 ? "up" : "down");
        } else {
          setJoystickDirection(rawX < 0 ? "left" : "right");
        }
      }

      function resetJoystick() {
        setJoystickDirection("");
        joystickStick.style.transform = "translate(-50%, -50%)";
      }

      function endTouchPointer(pointerId) {
        const action = activeTouchPointers.get(pointerId);
        if (!action) return;
        activeTouchPointers.delete(pointerId);
        if (action === "joystick") {
          joystickPointerId = null;
          resetJoystick();
          return;
        }
        if (action === "defense") {
          releaseInputKey("x", "touch");
          releaseInputKey("X", "touch");
        }
        touchControls.querySelector(`[data-touch-action="${action}"]`)
          ?.classList.remove("is-pressed");
      }

      touchControls.addEventListener("pointerdown", (event) => {
        const button = event.target.closest("[data-touch-action]");
        if (!button || gameOver) return;
        event.preventDefault();
        const action = button.dataset.touchAction;
        if (action === "joystick" && joystickPointerId !== null) return;
        activeTouchPointers.set(event.pointerId, action);
        button.setPointerCapture(event.pointerId);
        if (action === "joystick") {
          joystickPointerId = event.pointerId;
          updateJoystick(event);
        } else {
          button.classList.add("is-pressed");
          startTouchAction(action);
        }
      });

      touchControls.addEventListener("pointermove", (event) => {
        if (event.pointerId === joystickPointerId) {
          event.preventDefault();
          updateJoystick(event);
        }
      });

      touchControls.addEventListener("pointerup", (event) => endTouchPointer(event.pointerId));
      touchControls.addEventListener("pointercancel", (event) => endTouchPointer(event.pointerId));
      touchControls.addEventListener("lostpointercapture", (event) => endTouchPointer(event.pointerId));

      window.addEventListener("blur", () => {
        clearInputKeys();
        activeTouchPointers.clear();
        joystickPointerId = null;
        joystickDirection = "";
        joystickStick.style.transform = "translate(-50%, -50%)";
        touchControls.querySelectorAll(".is-pressed").forEach((button) => {
          button.classList.remove("is-pressed");
        });
      });
      restartButton.addEventListener("click", restartGame);
      window.addEventListener("resize", () => {
        resize();
        levelPlatforms = platforms();
      });

      resize();
      levelPlatforms = platforms();
      requestAnimationFrame(frame);
    })();
  </script>
</body>
</html>
