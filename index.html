<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>네모전사</title>
  <style>
    :root {
      color-scheme: dark;
      font-family: "Segoe UI", "Malgun Gothic", sans-serif;
      background: #000;
      color: #f5f5f5;
    }

    * {
      box-sizing: border-box;
    }

    body {
      min-width: 320px;
      min-height: 100vh;
      margin: 0;
      display: grid;
      place-items: center;
      background: #000;
    }

    main {
      width: min(100vw, 1280px);
      padding: 16px;
    }

    .topbar {
      display: grid;
      grid-template-columns: max-content minmax(0, 1fr);
      justify-content: space-between;
      align-items: start;
      gap: 16px;
      margin: 0 0 10px;
      color: #d7d7d7;
      font-size: 14px;
    }

    h1 {
      margin: 0;
      color: #fff;
      font-size: 20px;
      letter-spacing: 0.08em;
    }

    #readout {
      min-width: 0;
      text-align: right;
      overflow-wrap: anywhere;
      font-variant-numeric: tabular-nums;
    }

    .game-frame {
      position: relative;
      overflow: hidden;
      border: 1px solid #333;
      background: #000;
      box-shadow: 0 0 36px #161616;
    }

    .game-over {
      position: absolute;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 20px;
      background: rgba(0, 0, 0, 0.72);
    }

    .game-over[hidden],
    .mode-selection[hidden] {
      display: none;
    }

    .mode-selection {
      position: absolute;
      z-index: 3;
      inset: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 16px;
      padding: 20px;
      background: rgba(0, 0, 0, 0.82);
      text-align: center;
    }

    .mode-selection h2 {
      margin: 0;
      font-size: clamp(24px, 5vw, 40px);
    }

    .mode-selection p {
      margin: 0;
      color: #ccc;
    }

    .mode-options {
      display: flex;
      flex-wrap: wrap;
      justify-content: center;
      gap: 12px;
    }

    .mode-option {
      min-width: 140px;
      min-height: 52px;
      padding: 10px 18px;
      border: 2px solid #fff;
      border-radius: 8px;
      color: #fff;
      background: #27394b;
      font: inherit;
      font-size: 18px;
      font-weight: 700;
      cursor: pointer;
    }

    .mode-option:hover,
    .mode-option:focus-visible {
      background: #3a6388;
    }

    .game-over h2 {
      margin: 0;
      color: #fff;
      font-size: clamp(36px, 8vw, 72px);
      letter-spacing: 0.08em;
      text-shadow: 4px 4px 0 #8e2525;
    }

    .game-over button {
      padding: 10px 24px;
      border: 2px solid #fff;
      border-radius: 4px;
      color: #fff;
      background: #8e2525;
      font: inherit;
      font-size: 18px;
      cursor: pointer;
    }

    .game-over button:hover {
      background: #b83434;
    }

    .touch-controls {
      display: none;
    }

    canvas {
      display: block;
      width: 100%;
      height: min(68vh, 720px);
      min-height: 360px;
      background: #000;
      image-rendering: pixelated;
    }

    .help {
      display: flex;
      flex-wrap: wrap;
      gap: 8px 20px;
      margin: 10px 0 0;
      color: #aaa;
      font-size: 13px;
    }

    body.mode-not-selected .help {
      visibility: hidden;
    }

    kbd {
      padding: 2px 6px;
      border: 1px solid #555;
      border-radius: 4px;
      color: #fff;
      background: #181818;
      font: inherit;
    }

    .touch-help {
      display: none;
    }

    body.mobile-mode main {
      padding: 8px;
    }

    body.mobile-mode .topbar {
      flex-wrap: wrap;
      gap: 4px 12px;
    }

    body.mobile-mode #readout {
      white-space: normal;
      font-size: 12px;
    }

    body.mobile-mode canvas {
      height: 62vh;
      height: 62svh;
      min-height: 300px;
    }

    body.mobile-mode .touch-controls {
      position: absolute;
      z-index: 1;
      inset: 0;
      display: flex;
      align-items: flex-end;
      justify-content: space-between;
      gap: 8px;
      padding: 10px;
      pointer-events: none;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-control-group {
      display: flex;
      align-items: flex-end;
      gap: 6px;
      pointer-events: auto;
    }

    .touch-joystick {
      position: relative;
      width: 132px;
      height: 132px;
      flex: 0 0 132px;
      border: 2px solid rgba(255, 255, 255, 0.55);
      border-radius: 50%;
      background: rgba(15, 20, 28, 0.5);
      pointer-events: auto;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-joystick::before,
    .touch-joystick::after {
      position: absolute;
      inset: 50% auto auto 50%;
      content: "";
      background: rgba(255, 255, 255, 0.2);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .touch-joystick::before {
      width: 1px;
      height: 80%;
    }

    .touch-joystick::after {
      width: 80%;
      height: 1px;
    }

    .touch-joystick-stick {
      position: absolute;
      top: 50%;
      left: 50%;
      width: 54px;
      height: 54px;
      border: 2px solid rgba(255, 255, 255, 0.8);
      border-radius: 50%;
      background: rgba(70, 120, 190, 0.78);
      transform: translate(-50%, -50%);
      pointer-events: none;
    }

    .touch-control {
      min-width: 48px;
      min-height: 52px;
      padding: 6px;
      border: 1px solid rgba(255, 255, 255, 0.65);
      border-radius: 12px;
      color: #fff;
      background: rgba(15, 20, 28, 0.68);
      font: inherit;
      font-size: 16px;
      font-weight: 700;
      touch-action: none;
      user-select: none;
      -webkit-user-select: none;
    }

    .touch-control--large {
      min-width: 76px;
      min-height: 76px;
      border-radius: 50%;
      font-size: 17px;
    }

    .touch-control.is-pressed {
      background: rgba(70, 120, 190, 0.88);
      transform: scale(0.96);
    }

    body.mobile-mode .keyboard-help {
      display: none;
    }

    body.mobile-mode .touch-help {
      display: inline;
    }

    @media (max-width: 380px) {
      body.mobile-mode .touch-controls {
        gap: 4px;
        padding: 8px;
      }

      body.mobile-mode .touch-control-group {
        gap: 4px;
      }

      body.mobile-mode .touch-control {
        min-width: 42px;
        min-height: 48px;
        padding: 4px;
        font-size: 14px;
      }

      body.mobile-mode .touch-joystick {
        width: 116px;
        height: 116px;
        flex-basis: 116px;
      }

      body.mobile-mode .touch-joystick-stick {
        width: 48px;
        height: 48px;
      }

      body.mobile-mode .touch-control--large {
        min-width: 66px;
        min-height: 66px;
        font-size: 14px;
      }
    }
  </style>
</head>
<body>
  <main>
    <header class="topbar">

    <div class="game-frame">

        <div class="touch-joystick" data-touch-action="joystick" aria-label="이동 조이스틱">

        </div>
        <div class="touch-control-group">
          <button class="touch-control touch-control--large" type="button" data-touch-action="dash" aria-label="대쉬">대쉬</button>
          <button class="touch-control touch-control--large" type="button" data-touch-action="defense" aria-label="방어">방어</button>
        </div>
      </nav>
      <section id="game-over" class="game-over" aria-labelledby="game-over-title" hidden>
        <h2 id="game-over-title">GAME OVER</h2>
        <button id="restart" type="button">다시하기</button>
      </section>
    </div>

    </p>
  </main>

        cooldown: 0,
        dashHitThisDash: false
      };

      let viewWidth = 0;
      let viewHeight = 0;
      let cameraX = 0;
      let cameraInitialized = false;
      let backgroundGradient = null;
      let previousTime = 0;
      let gameOver = false;
      let monstersDefeated = 0;
      let pattern6 = null;
      let bossSpearAttack = null;
      let bossPatternOneStabs = 0;
      let bossPatternTwo = null;
      let bossParryStreak = 0;
      let bossParryStunElapsed = 0;
      let bossParryStunBlinkElapsed = 0;
      let bossParryMinions = [];
      let bossNightLevel = 0;

      function pressInputKey(key, source) {
        const sourceKeys = source === "keyboard" ? keyboardKeys : touchKeys;
        sourceKeys.add(key);
        keys.add(key);
      }

      function releaseInputKey(key, source) {
        const sourceKeys = source === "keyboard" ? keyboardKeys : touchKeys;
        sourceKeys.delete(key);
        if (!keyboardKeys.has(key) && !touchKeys.has(key)) {
          keys.delete(key);
        }
      }

      function releaseInputKeys(...releasedKeys) {
        for (const key of releasedKeys) {
          keyboardKeys.delete(key);
          touchKeys.delete(key);
          keys.delete(key);
        }
      }

      function clearInputKeys() {
        keys.clear();
        keyboardKeys.clear();
        touchKeys.clear();
      }

      function resize() {
        const bounds = canvas.getBoundingClientRect();
        const pixelRatio = Math.min(window.devicePixelRatio || 1, MAX_PIXEL_RATIO);
        viewWidth = bounds.width;
        viewHeight = bounds.height;
        canvas.width = Math.round(viewWidth * pixelRatio);
        canvas.height = Math.round(viewHeight * pixelRatio);
        context.setTransform(pixelRatio, 0, 0, pixelRatio, 0, 0);
        backgroundGradient = context.createLinearGradient(0, 0, 0, viewHeight);
        backgroundGradient.addColorStop(0, "#b8d7e5");
        backgroundGradient.addColorStop(0.65, "#d0e1e7");
        backgroundGradient.addColorStop(1, "#e1e5e3");
        if (player.y === 0) {
          player.x = Math.max(0, viewWidth / 2 - player.width / 2);
          player.y = floorY() - player.height;
        }
        if (!cameraInitialized) {
          cameraX = Math.max(0, Math.min(WORLD_WIDTH - viewWidth, player.x + player.width / 2 - viewWidth / 2));
          cameraInitialized = true;
        }
        if (monster.y === 0) {
          monster.y = floorY() - monster.height;
          monster.x = Math.min(
            WORLD_WIDTH - monster.width,
            cameraX + viewWidth + BLOCK * 2
          );
          if (monster.x <= player.x + player.width) {
            monster.x = Math.max(0, cameraX - monster.width - BLOCK * 2);
            monster.facing = 1;
          }
          monster.spawnX = monster.x;
          monster.spawnY = monster.y;
          monster.spawnFacing = monster.facing;
        }
      }

      function startGame(mode) {
        if (gameStarted) return;
        document.body.classList.remove("mode-not-selected", "computer-mode", "mobile-mode");
        document.body.classList.add(mode === "mobile" ? "mobile-mode" : "computer-mode");
        resize();
        levelPlatforms = platforms();

        player.x = Math.max(0, viewWidth / 2 - player.width / 2);
        player.y = floorY() - player.height;
        player.vx = 0;
        player.vy = 0;
        player.grounded = true;
        resetBoss();

        monster.y = floorY() - monster.height;
        monster.x = Math.min(
          WORLD_WIDTH - monster.width,
          viewWidth + BLOCK * 2
        );
        monster.spawnX = monster.x;
        monster.spawnY = monster.y;
        monster.facing = -1;
        monster.spawnFacing = monster.facing;

        cameraX = Math.max(
          0,
          Math.min(WORLD_WIDTH - viewWidth, player.x + player.width / 2 - viewWidth / 2)
        );
        cameraInitialized = true;
        previousTime = 0;
        gameStarted = true;
        modeSelection.hidden = true;
        draw();
      }

      function floorY() {
        return viewHeight - 56;
      }

      function platforms() {
        return [];
      }

      function bossGroundCenterY() {
        return floorY() - BOSS_SIZE * (SPRITE_VISIBLE_BOTTOM - 0.5);
      }

      function isStandingOnSurface() {
        return isStandingAt(player.x, player.y);
      }

      function isStandingAt(x, y) {
        const bottom = y + player.height;
        if (Math.abs(bottom - floorY()) <= 1) return true;
        return levelPlatforms.some((platform) => {
          const overlaps = x + player.width > platform.x
            && x < platform.x + platform.width;
          return overlaps && Math.abs(bottom - platform.y) <= 1;
        });
      }

      let levelPlatforms = [];

      function startDash() {
        if (player.dashCooldown > 0
          || player.dashElapsed > 0
          || player.defenseBreakElapsed > 0
          || isDefenseHeld()) return;
        dashSound.currentTime = 0;
        dashSound.play().catch((error) => {
          console.error("돌진 소리를 재생하지 못했습니다.", error);
        });
        player.dashStartX = player.x;
        player.dashDirection = player.facing;
        boss.dashHitThisDash = false;
        player.dashElapsed = 0.000001;
        player.dashActiveThisFrame = false;
        player.dashHitbox = null;
        player.dashEffectElapsed = 0;
        player.dashEffectX = player.x;
        player.dashEffectGroundY = player.y + player.height;
        player.slowElapsed = 0;
        player.slowMovementElapsed = 0;
        player.slowBurstCount = 0;
        player.slowEffects = [];
        player.vy = 0;
      }

      function jump() {
        if (!player.grounded || player.defenseBreakElapsed > 0) return;
        player.vy = JUMP_SPEED;
        player.grounded = false;
      }

      function dropThroughPlatform() {
        if (!player.grounded || player.defenseBreakElapsed > 0) return;
        const platform = levelPlatforms.find((item) => {
          const overlaps = player.x + player.width > item.x
            && player.x < item.x + item.width;
          return overlaps && Math.abs(player.y + player.height - item.y) <= 1;
        });
        if (!platform) return;
        player.y += 2;
        player.vy = Math.max(player.vy, BLOCK);
        player.grounded = false;
        player.dropThroughElapsed = DROP_THROUGH_DURATION;
      }

      function handleInput() {
        if (player.dashElapsed > 0) return;
        player.vx = 0;
        const defenseSlowdown = isDefenseHeld() ? 0.5 : 1;
        const moveSpeed = (player.grounded ? WALK_SPEED : AIR_SPEED) * defenseSlowdown;
        if (player.defenseBreakElapsed > 0) return;
        if (keys.has("ArrowLeft")) {
          player.vx = -moveSpeed;
          player.facing = -1;
        }
        if (keys.has("ArrowRight")) {
          player.vx = moveSpeed;
          player.facing = 1;
        }
      }

      function overlaps(first, second) {
        return first.x < second.x + second.width
          && first.x + first.width > second.x
          && first.y < second.y + second.height
          && first.y + first.height > second.y;
      }

      function getDefenseShieldHitbox() {
        const playerHitbox = getPlayerHitbox();
        const shieldSize = player.width * 1.5;
        return {
          x: playerHitbox.x + playerHitbox.width / 2 - shieldSize / 2,
          y: playerHitbox.y + playerHitbox.height / 2 - shieldSize / 2,
          width: shieldSize,
          height: shieldSize
        };
      }

      function isDefenseEdgeContact(attackHitbox) {
        if (!attackHitbox) return false;
        const shieldHitbox = getDefenseShieldHitbox();
        return DEFENSE_SHIELD_BANDS.some((band) => {
          const coloredArea = {
            x: shieldHitbox.x + shieldHitbox.width * band.left,
            y: shieldHitbox.y + shieldHitbox.height * band.top,
            width: shieldHitbox.width * (band.right - band.left),
            height: shieldHitbox.height * (band.bottom - band.top)
          };
          return overlaps(attackHitbox, coloredArea);
        });
      }

      function isDefenseHeld() {
        return keys.has("x") || keys.has("X");
      }

      function playSound(audio, message, playbackRate = 1) {
        audio.currentTime = 0;
        audio.playbackRate = playbackRate;
        audio.play().catch((error) => {
          console.error(message, error);
        });
      }

      function getPlayerHitbox() {
        const spriteY = player.y + player.height * (1 - SPRITE_VISIBLE_BOTTOM);
        return {
          x: player.x + player.width * PLAYER_ART_VISIBLE_MIN_X,
          y: spriteY + player.height * PLAYER_ART_VISIBLE_MIN_Y,
          width: player.width * (PLAYER_ART_VISIBLE_MAX_X - PLAYER_ART_VISIBLE_MIN_X),
          height: player.height * (PLAYER_ART_VISIBLE_MAX_Y - PLAYER_ART_VISIBLE_MIN_Y)
        };
      }

      function getMonsterHitbox() {
        return {
          x: monster.x + monster.shakeOffsetX + monster.width * MONSTER_ART_LEFT_X,
          y: monster.y + monster.height * (1 - SPRITE_VISIBLE_BOTTOM) + monster.height * MONSTER_ART_TOP_Y,
          width: monster.width * (MONSTER_ART_RIGHT_X - MONSTER_ART_LEFT_X),
          height: monster.height * (MONSTER_ART_BOTTOM_Y - MONSTER_ART_TOP_Y)
        };
      }

      function projectileRotation(projectile, progress) {
        const dx = projectile.targetX - projectile.startX;
        const dy = projectile.targetY - projectile.startY
          - Math.PI * projectile.arcHeight * Math.cos(Math.PI * progress);
        return Math.atan2(dy, dx) + Math.PI / 2 + progress * Math.PI * 2 * BONE_ROTATIONS;
      }

      function boneVisibleHitbox(projectile, progress) {
        const renderedSize = BLOCK * 2;
        const visibleCenterOffset = (BONE_ART_VISIBLE_MIN + BONE_ART_VISIBLE_MAX - 1)
          * renderedSize / 2;
        const visibleSize = (BONE_ART_VISIBLE_MAX - BONE_ART_VISIBLE_MIN) * renderedSize;
        const angle = projectileRotation(projectile, progress);
        const cos = Math.cos(angle);
        const sin = Math.sin(angle);
        const centerX = projectile.x + visibleCenterOffset * (cos - sin);
        const centerY = projectile.y + visibleCenterOffset * (sin + cos);
        const halfExtent = visibleSize * (Math.abs(cos) + Math.abs(sin)) / 2;
        return {
          x: centerX - halfExtent,
          y: centerY - halfExtent,
          width: halfExtent * 2,
          height: halfExtent * 2
        };
      }

      function heldBonePosition(monsterX, monsterY) {
        const boneSize = BLOCK * 2;
        const monsterSpriteY = monsterY + monster.height * (1 - SPRITE_VISIBLE_BOTTOM);
        const skullAttachEdge = monster.facing > 0
          ? monsterX + monster.width * (1 - MONSTER_ART_LEFT_X)
          : monsterX + monster.width * MONSTER_ART_LEFT_X;
        const boneAttachOffset = monster.facing > 0
          ? boneSize * HELD_BONE_ART_LEFT_X
          : boneSize * (1 - HELD_BONE_ART_LEFT_X);
        return {
          x: skullAttachEdge - boneAttachOffset,
          y: monsterSpriteY + (monster.height - boneSize) / 2,
          size: boneSize
        };
      }

      function launchBone() {
        const heldBone = heldBonePosition(monster.x + monster.shakeOffsetX, monster.y);
        const startX = heldBone.x + heldBone.size / 2;
        const startY = heldBone.y + heldBone.size / 2;
        const targetX = player.x + player.width / 2;
        const targetY = player.y + player.height / 2;
        monster.projectiles.push({
          startX,
          startY,
          targetX,
          targetY,
          x: startX,
          y: startY,
          elapsed: 0,
          duration: BONE_FLIGHT_DURATION,
          arcHeight: Math.max(BLOCK * 2, Math.abs(targetX - startX) * 0.2)
        });
        monster.boneThrown = true;
      }

      function resetBoss() {
        bossSpearAttack = null;
        bossPatternOneStabs = 0;
        bossPatternTwo = null;
        Object.assign(boss, {
          x: player.x + player.width / 2,
          y: bossGroundCenterY(),
          spriteIndex: 2,
          facing: -1,
          hp: BOSS_MAX_HP,
          maxHp: BOSS_MAX_HP,
          phase: 1,
          active: false,
          defeated: false,
          pattern: "",
          step: "",
          cooldown: 0,
          dashHitThisDash: false
        });
        teleportBossAwayFromPlayer(BOSS_PATTERN_ONE_TRIGGER_DISTANCE);
      }

      function spawnBoss() {
        boss.active = true;
        bossMusic.currentTime = 0;
        bossMusic.play().catch((error) => {
          console.error("보스 음악을 재생하지 못했습니다.", error);
        });
        boss.hp = BOSS_MAX_HP;
        boss.maxHp = BOSS_MAX_HP;
        boss.phase = 1;
        boss.spriteIndex = 2;
        boss.x = player.x + player.width / 2;
        teleportBossAwayFromPlayer(BOSS_PATTERN_ONE_TRIGGER_DISTANCE);
        boss.y = bossGroundCenterY();
        boss.facing = player.x + player.width / 2 < boss.x ? -1 : 1;
        boss.cooldown = 0;
        bossSpearAttack = null;
        bossPatternOneStabs = 0;
        bossPatternTwo = null;
      }

      function enterBossFight() {
        if (boss.active) return;
        monstersDefeated = 3;
        monster.hp = 0;
        monster.dead = true;
        monster.permanentlyDefeated = true;
        monster.deathElapsed = MONSTER_DEATH_FADE_DURATION;
        monster.projectiles = [];
        monster.pendingHitElapsed = 0;
        spawnBoss();
      }

      function bossPatternSprite(spriteIndex) {
        return spriteIndex;
      }

      function startBossPattern(pattern, step) {
        boss.pattern = pattern;
        boss.step = step;
      }

      function getBossHitbox() {
        return {
          x: boss.x - BOSS_SPRITE_HITBOX_SIZE / 2,
          y: boss.y - BOSS_SPRITE_HITBOX_SIZE / 2,
          width: BOSS_SPRITE_HITBOX_SIZE,
          height: BOSS_SPRITE_HITBOX_SIZE
        };
      }

      function startBossSpearAttack() {
        bossSpearAttack = {
          elapsed: 0,
          verticalOffset: (Math.floor(Math.random() * 3) - 1) * BLOCK,
          hitApplied: false
        };
      }

      function updateBossSpearAttack(delta) {
        if (!bossSpearAttack) startBossSpearAttack();
        bossSpearAttack.elapsed += delta;
        const thrustProgress = Math.min(
          1,
          bossSpearAttack.elapsed / BOSS04_THRUST_DURATION
        );
        const thrustLength = BOSS04_THRUST_DISTANCE * thrustProgress;
        const hitbox = {
          x: boss.facing > 0 ? boss.x : boss.x - thrustLength,
          y: boss.y + bossSpearAttack.verticalOffset - BLOCK / 2,
          width: thrustLength,
          height: BLOCK
        };
        if (!bossSpearAttack.hitApplied
          && thrustLength > 0
          && hitPlayerWithBossAttack(hitbox, 5)) {
          bossSpearAttack.hitApplied = true;
        }

        while (bossSpearAttack.elapsed >= BOSS04_ATTACK_INTERVAL) {
          const remainingElapsed = bossSpearAttack.elapsed - BOSS04_ATTACK_INTERVAL;
          bossPatternOneStabs += 1;
          if (bossPatternOneStabs >= BOSS_PATTERN_ONE_STAB_COUNT) return true;
          startBossSpearAttack();
          bossSpearAttack.elapsed = remainingElapsed;
        }
        return false;
      }

      function moveBossTowardPlayer(
        playerCenter,
        stopDistance,
        delta,
        speed = BOSS_APPROACH_SPEED
      ) {
        const targetX = Math.max(
          BOSS_SIZE / 2,
          Math.min(
            WORLD_WIDTH - BOSS_SIZE / 2,
            playerCenter - boss.facing * stopDistance
          )
        );
        const distanceToTarget = targetX - boss.x;
        boss.x += Math.sign(distanceToTarget)
          * Math.min(Math.abs(distanceToTarget), speed * delta);
      }

      function damageBoss(amount) {
        if (boss.defeated || amount <= 0) return;
        boss.hp = Math.max(0, boss.hp - amount);
        if (boss.hp === 0) {
          boss.defeated = true;
          boss.pattern = "";
          boss.step = "";
          bossPatternTwo = null;
          bossSpearAttack = null;
        }
      }

      function hitPlayerWithBossAttack(hitbox, damage) {
        if (overlaps(hitbox, getPlayerHitbox())) {
          damagePlayer(damage, 0, true);
          return true;
        }
        return false;
      }

      function startBossPatternOne() {
        boss.spriteIndex = bossPatternSprite(2);
        boss.facing = player.x + player.width / 2 < boss.x ? -1 : 1;
        bossPatternOneStabs = 0;
        startBossPattern("pattern1", "approach");
      }

      function teleportBossAwayFromPlayer(distance) {
        const playerCenter = player.x + player.width / 2;
        const minBossX = BOSS_SIZE / 2;
        const maxBossX = WORLD_WIDTH - BOSS_SIZE / 2;
        const leftX = playerCenter - distance;
        const rightX = playerCenter + distance;
        const preferredDirection = boss.x < playerCenter ? -1 : 1;
        const preferredX = preferredDirection < 0 ? leftX : rightX;
        const alternateX = preferredDirection < 0 ? rightX : leftX;
        const preferredIsAvailable = preferredX >= minBossX && preferredX <= maxBossX;
        const alternateIsAvailable = alternateX >= minBossX && alternateX <= maxBossX;

        if (preferredIsAvailable) {
          boss.x = preferredX;
        } else if (alternateIsAvailable) {
          boss.x = alternateX;
        } else {
          boss.x = Math.abs(playerCenter - minBossX) >= Math.abs(maxBossX - playerCenter)
            ? minBossX
            : maxBossX;
        }
      }

      function startBossPatternTwo() {
        const playerCenterX = player.x + player.width / 2;
        const playerCenterY = player.y + player.height / 2;
        const targetY = playerCenterY - BLOCK * 9;
        const diveStartX = playerCenterX - BOSS_SIZE * 0.75;
        const diveEndY = floorY() + BOSS_SIZE * 0.5;
        const diveProgressAtTarget = (playerCenterY - targetY) / (diveEndY - targetY);
        bossPatternTwo = {
          targetX: playerCenterX,
          playerY: playerCenterY,
          targetY,
          diveStartX,
          diveStartY: targetY,
          diveEndX: diveStartX + (playerCenterX - diveStartX) / diveProgressAtTarget,
          diveEndY,
          groundY: floorY(),
          originY: boss.y,
          elapsed: 0,
          wavePairs: []
        };
        bossSpearAttack = null;
        startBossPattern("pattern2", "pattern2-leap");
      }

      function createBossPatternTwoWavePair() {
        bossPatternTwo.wavePairs.push({
          elapsed: 0,
          tiles: Array.from(
            { length: BOSS_PATTERN_TWO_TILES_PER_SIDE * 2 + 1 },
            (_, index) => {
              const offset = index - BOSS_PATTERN_TWO_TILES_PER_SIDE;
              const delay = Math.abs(offset) * BOSS17_WAVE_TILE_WIDTH
                / BOSS_PATTERN_TWO_WAVE_SPEED;
              return {
                x: bossPatternTwo.targetX + offset * BOSS17_WAVE_TILE_WIDTH,
                delay,
                elapsed: -delay
              };
            }
          ),
          hitPlayer: false
        });
      }

      function updateBossPatternTwoWaves(delta) {
        const playerHitbox = getPlayerHitbox();
        for (const pair of bossPatternTwo.wavePairs) {
          pair.elapsed += delta;
          for (const tile of pair.tiles) {
            tile.elapsed = pair.elapsed - tile.delay;
            if (tile.elapsed < 0 || tile.elapsed >= BOSS_PATTERN_TWO_WAVE_LIFETIME) continue;
            const scale = tile.elapsed < BOSS17_GROW_DURATION
              ? 0.5 + 0.5 * (tile.elapsed / BOSS17_GROW_DURATION)
              : 1;
            const visibleHeight = BOSS17_WAVE_TILE_HEIGHT * scale;
            const hitbox = {
              x: tile.x - BOSS17_WAVE_TILE_WIDTH / 2,
              y: bossPatternTwo.groundY - visibleHeight,
              width: BOSS17_WAVE_TILE_WIDTH,
              height: visibleHeight
            };
            if (!pair.hitPlayer && overlaps(hitbox, playerHitbox)) {
              pair.hitPlayer = true;
              damagePlayer(5, 0, true);
            }
          }
        }
      }

      function bossPatternTwoWavesComplete() {
        return bossPatternTwo.wavePairs.length === 1
          && bossPatternTwo.wavePairs.every((pair) => pair.tiles.every((tile) => (
            pair.elapsed - tile.delay >= BOSS_PATTERN_TWO_WAVE_LIFETIME
          )));
      }

      function updateBossPatternTwo(delta) {
        bossPatternTwo.elapsed += delta;
        switch (boss.step) {
          case "pattern2-leap": {
            const progress = Math.min(
              1,
              bossPatternTwo.elapsed / BOSS_PATTERN_TWO_LEAP_DURATION
            );
            boss.y = bossPatternTwo.originY - progress * (viewHeight + BOSS_SIZE);
            if (progress >= 1) {
              boss.y = bossPatternTwo.originY;
              boss.step = "pattern2-aim";
              bossPatternTwo.elapsed = 0;
            }
            break;
          }
          case "pattern2-aim":
            if (bossPatternTwo.elapsed >= BOSS_PATTERN_TWO_AIM_DURATION) {
              boss.step = "pattern2-dive";
              bossPatternTwo.elapsed = 0;
            }
            break;
          case "pattern2-dive":
            if (bossPatternTwo.elapsed >= BOSS_PATTERN_TWO_DIVE_DURATION) {
              boss.step = "pattern2-impact";
              bossPatternTwo.elapsed = 0;
              bossPatternTwo.groundY = floorY();
            }
            break;
          case "pattern2-impact":
            if (bossPatternTwo.wavePairs.length === 0
              && bossPatternTwo.elapsed >= BOSS17_GROW_DURATION) {
              createBossPatternTwoWavePair();
            }
            updateBossPatternTwoWaves(delta);
            if (bossPatternTwo.elapsed >= BOSS17_FADE_START + BOSS17_FADE_DURATION
              && bossPatternTwoWavesComplete()) {
              boss.step = "pattern2-return";
              bossPatternTwo.elapsed = 0;
            }
            break;
          case "pattern2-return":
            if (bossPatternTwo.elapsed >= 0.3) {
              teleportBossAwayFromPlayer(BLOCK * 20);
              boss.y = bossGroundCenterY();
              bossPatternTwo = null;
              startBossPatternOne();
            }
            break;
          default:
            boss.pattern = "";
            boss.step = "";
            bossPatternTwo = null;
            break;
        }
      }

      function startPattern6() {
        if (pattern6) return;
        const playerCenterX = player.x + player.width / 2;
        const playerCenterY = player.y + player.height / 2;
        pattern6 = {
          phase: "target",
          elapsed: 0,
          originX: playerCenterX,
          originY: playerCenterY,
          bosses: [
            { spriteIndex: 1, x: playerCenterX, y: playerCenterY - PATTERN_BOSS_VERTICAL_GAP / 2 },
            { spriteIndex: 2, x: playerCenterX, y: playerCenterY + PATTERN_BOSS_VERTICAL_GAP / 2 }
          ]
        };
      }

      function patternBossColorAreasTouch(firstBoss, secondBoss) {
        const cellSize = PATTERN_BOSS_SIZE / 32;
        const firstRows = PATTERN_BOSS_COLOR_SPANS[firstBoss.spriteIndex + 12];
        const secondRows = PATTERN_BOSS_COLOR_SPANS[secondBoss.spriteIndex + 12];
        const firstLeft = firstBoss.x + (firstBoss.shakeOffsetX || 0) - PATTERN_BOSS_SIZE / 2;
        const firstTop = firstBoss.y - PATTERN_BOSS_SIZE / 2;
        const secondLeft = secondBoss.x + (secondBoss.shakeOffsetX || 0) - PATTERN_BOSS_SIZE / 2;
        const secondTop = secondBoss.y - PATTERN_BOSS_SIZE / 2;

        for (const [firstRow, firstSpans] of Object.entries(firstRows)) {
          const firstY = firstTop + Number(firstRow) * cellSize;
          for (const [firstStart, firstEnd] of firstSpans) {
            const firstX = firstLeft + firstStart * cellSize;
            const firstRight = firstLeft + (firstEnd + 1) * cellSize;
            for (const [secondRow, secondSpans] of Object.entries(secondRows)) {
              const secondY = secondTop + Number(secondRow) * cellSize;
              if (firstY >= secondY + cellSize || firstY + cellSize <= secondY) continue;
              for (const [secondStart, secondEnd] of secondSpans) {
                const secondX = secondLeft + secondStart * cellSize;
                const secondRight = secondLeft + (secondEnd + 1) * cellSize;
                if (firstX < secondRight && firstRight > secondX) return true;
              }
            }
          }
        }
        return false;
      }

      function getPatternBossHitbox(boss) {
        const bounds = PATTERN_BOSS_HITBOX_BOUNDS[boss.spriteIndex + 12];
        const spriteLeft = boss.x + (boss.shakeOffsetX || 0) - PATTERN_BOSS_SIZE / 2;
        const spriteTop = boss.y - PATTERN_BOSS_SIZE / 2;
        return {
          x: spriteLeft + PATTERN_BOSS_SIZE * bounds.left,
          y: spriteTop + PATTERN_BOSS_SIZE * bounds.top,
          width: PATTERN_BOSS_SIZE * (bounds.right - bounds.left),
          height: PATTERN_BOSS_SIZE * (bounds.bottom - bounds.top)
        };
      }

      function updatePattern6(delta) {
        if (!pattern6) return;
        pattern6.elapsed += delta;
        if (pattern6.phase === "target" || pattern6.phase === "strike") {
          const playerHitbox = getPlayerHitbox();
          const attackingBoss = pattern6.bosses.find((boss) => {
            const bossHitbox = getPatternBossHitbox(boss);
            const edgeContact = isDefenseHeld() && isDefenseEdgeContact(bossHitbox);
            return overlaps(bossHitbox, playerHitbox) || edgeContact;
          });
          if (attackingBoss) {
            damagePlayer(PATTERN_BOSS_DAMAGE, 0, true);
          }
        }
        if (pattern6.phase === "target") {
          const leftBoss = pattern6.bosses.find((boss) => boss.spriteIndex === 1);
          const rightBoss = pattern6.bosses.find((boss) => boss.spriteIndex === 2);
          if (!leftBoss || !rightBoss) return;

          pattern6.originX = player.x + player.width / 2;
          leftBoss.shakeOffsetX = Math.sin(pattern6.elapsed * PATTERN_BOSS13_SHAKE_SPEED)
            * PATTERN_BOSS13_SHAKE_AMPLITUDE;
          leftBoss.x = pattern6.originX;
          rightBoss.x = pattern6.originX;
          if (pattern6.elapsed >= PATTERN_BOSS_TARGET_DURATION) {
            leftBoss.shakeOffsetX = 0;
            pattern6.phase = "strike";
            pattern6.elapsed = 0;
          }
        } else if (pattern6.phase === "strike") {
          const leftBoss = pattern6.bosses.find((boss) => boss.spriteIndex === 1);
          const rightBoss = pattern6.bosses.find((boss) => boss.spriteIndex === 2);
          if (!leftBoss || !rightBoss) return;

          const rightTargetY = floorY()
            + PATTERN_BOSS_SIZE / 2
            - PATTERN_BOSS_SIZE * PATTERN_BOSS14_COLOR_BOTTOM;
          const cellSize = PATTERN_BOSS_SIZE / 32;
          const leftTargetY = rightTargetY
            - cellSize * (22 - 15)
            + cellSize * 0.1;
          let remaining = delta;
          const substepDuration = (cellSize / 2) / PATTERN_BOSS_APPROACH_SPEED;
          while (remaining > 0) {
            const step = Math.min(remaining, substepDuration);
            const leftDistance = leftTargetY - leftBoss.y;
            const rightDistance = rightTargetY - rightBoss.y;
            leftBoss.y += Math.sign(leftDistance)
              * Math.min(Math.abs(leftDistance), PATTERN_BOSS_APPROACH_SPEED * step);
            rightBoss.y += Math.sign(rightDistance)
              * Math.min(Math.abs(rightDistance), PATTERN_BOSS_APPROACH_SPEED * step);
            remaining -= step;

            if (patternBossColorAreasTouch(leftBoss, rightBoss)) {
              leftBoss.y = leftTargetY;
              rightBoss.y = rightTargetY;
              pattern6.phase = "fade";
              pattern6.elapsed = 0;
              break;
            }
          }
        } else if (pattern6.phase === "fade" && pattern6.elapsed >= PATTERN_BOSS_FADE_DURATION) {
          pattern6.phase = "boss12";
          pattern6.elapsed = 0;
        } else if (
          pattern6.phase === "boss12"
          && pattern6.elapsed >= PATTERN_BOSS12_DURATION
        ) {
          pattern6 = null;
        }
      }

      function updateBoss(delta) {
        if (!boss.active || boss.defeated) return;

        if (bossParryStunElapsed > 0) {
          bossParryStunElapsed = Math.max(0, bossParryStunElapsed - delta);
          bossParryStunBlinkElapsed += delta;
          if (bossParryStunElapsed > 0) {
            bossSpearAttack = null;
            return;
          }
          bossParryStunBlinkElapsed = 0;
        }

        boss.cooldown = Math.max(0, boss.cooldown - delta);
        if (boss.defeated) return;

        if (boss.pattern === "pattern2") {
          updateBossPatternTwo(delta);
          boss.x = Math.max(BOSS_SIZE / 2, Math.min(WORLD_WIDTH - BOSS_SIZE / 2, boss.x));
          return;
        }

        if (player.dashHitbox && !boss.dashHitThisDash && overlaps(player.dashHitbox, getBossHitbox())) {
          boss.dashHitThisDash = true;
          damageBoss(BOSS_DASH_DAMAGE);
          if (boss.defeated) return;
        }

        if (!boss.pattern) {
          if (boss.cooldown === 0) {
            const distance = Math.abs(
              (player.x + player.width / 2) - boss.x
            );
            if (distance >= BOSS_PATTERN_ONE_TRIGGER_DISTANCE) {
              startBossPatternOne();
            }
          }
          if (!boss.pattern) {
            const playerCenter = player.x + player.width / 2;
            boss.facing = playerCenter < boss.x ? -1 : 1;
            moveBossTowardPlayer(playerCenter, BOSS04_THRUST_DISTANCE, delta);
          }
        }
        if (!boss.pattern) return;

        switch (boss.step) {
          case "approach": {
            boss.spriteIndex = bossPatternSprite(2);
            const playerCenter = player.x + player.width / 2;
            const distance = Math.abs(playerCenter - boss.x);
            boss.facing = playerCenter < boss.x ? -1 : 1;
            if (distance <= BOSS04_THRUST_DISTANCE) {
              boss.step = "barrage";
              startBossSpearAttack();
            } else {
              moveBossTowardPlayer(
                playerCenter,
                BOSS04_THRUST_DISTANCE,
                delta,
                BOSS_PATTERN_ONE_CHARGE_SPEED
              );
            }
            break;
          }
          case "barrage": {
            const playerCenter = player.x + player.width / 2;
            boss.facing = playerCenter < boss.x ? -1 : 1;
            moveBossTowardPlayer(playerCenter, BOSS04_THRUST_DISTANCE, delta);
            if (updateBossSpearAttack(delta)) startBossPatternTwo();
            if (bossParryStunElapsed > 0) {
              bossSpearAttack = null;
              return;
            }
            break;
          }
          default:
            boss.pattern = "";
            boss.step = "";
            break;
        }

        boss.x = Math.max(BOSS_SIZE / 2, Math.min(WORLD_WIDTH - BOSS_SIZE / 2, boss.x));
      }

      function spawnBossParryMinions() {
        const playerCenter = player.x + player.width / 2;
        for (let index = 0; index < BOSS_PARRY_MINION_COUNT; index += 1) {
          const direction = index === 0 ? -1 : 1;
          const x = Math.max(
            0,
            Math.min(
              WORLD_WIDTH - MONSTER_SIZE,
              playerCenter + direction * BOSS_PARRY_MINION_SPAWN_DISTANCE - MONSTER_SIZE / 2
            )
          );
          bossParryMinions.push({
            x,
            y: floorY() - MONSTER_SIZE,
            facing: playerCenter < x + MONSTER_SIZE / 2 ? -1 : 1,
            attackCooldown: 0.5,
            alive: true
          });
        }
      }

      function getBossParryMinionHitbox(minion) {
        return {
          x: minion.x + MONSTER_SIZE * MONSTER_ART_LEFT_X,
          y: minion.y + MONSTER_SIZE * (1 - SPRITE_VISIBLE_BOTTOM)
            + MONSTER_SIZE * MONSTER_ART_TOP_Y,
          width: MONSTER_SIZE * (MONSTER_ART_RIGHT_X - MONSTER_ART_LEFT_X),
          height: MONSTER_SIZE * (MONSTER_ART_BOTTOM_Y - MONSTER_ART_TOP_Y)
        };
      }

      function updateBossParryMinions(delta) {
        const playerHitbox = getPlayerHitbox();
        for (const minion of bossParryMinions) {
          if (!minion.alive) continue;
          minion.attackCooldown = Math.max(0, minion.attackCooldown - delta);
          const minionHitbox = getBossParryMinionHitbox(minion);
          const horizontalGap = Math.max(
            0,
            minionHitbox.x - (playerHitbox.x + playerHitbox.width),
            playerHitbox.x - (minionHitbox.x + minionHitbox.width)
          );
          const verticalOverlap = playerHitbox.y < minionHitbox.y + minionHitbox.height
            && playerHitbox.y + playerHitbox.height > minionHitbox.y;

          if (player.dashActiveThisFrame
            && player.dashHitbox
            && overlaps(player.dashHitbox, minionHitbox)) {
            minion.alive = false;
            continue;
          }

          const horizontalDistance = player.x + player.width / 2
            - (minion.x + MONSTER_SIZE / 2);
          if (horizontalDistance !== 0) minion.facing = Math.sign(horizontalDistance);
          if (horizontalGap <= MONSTER_MELEE_RANGE && verticalOverlap) {
            if (minion.attackCooldown === 0) {
              damagePlayer(MONSTER_DAMAGE);
              minion.attackCooldown = MONSTER_MELEE_COOLDOWN;
            }
          } else {
            minion.x += minion.facing * MONSTER_SPEED * delta;
            minion.x = Math.max(0, Math.min(WORLD_WIDTH - MONSTER_SIZE, minion.x));
          }
        }
        bossParryMinions = bossParryMinions.filter((minion) => minion.alive);
      }

      function hitMonster(direction) {
        monsterHitSound.currentTime = 0;
        monsterHitSound.play().catch((error) => {
          console.error("몬스터 피격 소리를 재생하지 못했습니다.", error);
        });
        monster.hp = Math.max(0, monster.hp - DASH_DAMAGE);
        if (monster.hp === 0) {
          monster.dead = true;
          monster.deathElapsed = 0;
          monstersDefeated += 1;
          monster.permanentlyDefeated = monstersDefeated >= 3;
          monster.respawnElapsed = monster.permanentlyDefeated ? 0 : MONSTER_RESPAWN_DELAY;
          monster.projectiles = [];
          monster.pendingHitElapsed = 0;
          monster.shakeOffsetX = 0;
          if (monster.permanentlyDefeated) spawnBoss();
          return;
        }
        player.hitStopElapsed = PLAYER_MONSTER_HIT_STOP_DURATION;
        player.vx = 0;
        player.dashElapsed = 0;
        player.slowElapsed = 0;
        player.slowMovementElapsed = 0;
        player.slowEffects = [];
        player.dashEffectElapsed = 0;
        monster.hitElapsed = MONSTER_HIT_DURATION;
        monster.hitPhase = "shake";
        monster.hitPhaseElapsed = 0;
        monster.hitDirection = direction;
        monster.hitStartX = monster.x;
        monster.hitTargetX = Math.max(
          0,
          Math.min(
            WORLD_WIDTH - monster.width,
            monster.x + direction * MONSTER_KNOCKBACK_DISTANCE
          )
        );
        monster.shakeOffsetX = 0;
        monster.mode = "hit";
        monster.modeElapsed = 0;
        monster.meleeWindupElapsed = 0;
        monster.meleeElapsed = 0;
      }

      function updateMonster(delta) {
        if (monster.dead) {
          monster.deathElapsed = Math.min(
            MONSTER_DEATH_FADE_DURATION,
            monster.deathElapsed + delta
          );
          if (monster.permanentlyDefeated) return;
          monster.respawnElapsed = Math.max(0, monster.respawnElapsed - delta);
          if (monster.respawnElapsed === 0) {
            monster.x = monster.spawnX;
            monster.y = monster.spawnY;
            monster.hp = MONSTER_MAX_HP;
            monster.dead = false;
            monster.permanentlyDefeated = false;
            monster.deathElapsed = 0;
            monster.mode = "approach";
            monster.modeElapsed = 0;
            monster.attackCooldown = 0.5;
            monster.meleeWindupElapsed = 0;
            monster.meleeElapsed = 0;
            monster.meleeCooldown = 0;
            monster.hitElapsed = 0;
            monster.hitPhase = "";
            monster.hitPhaseElapsed = 0;
            monster.shakeOffsetX = 0;
            monster.boneThrown = false;
            monster.projectiles = [];
          }
          return;
        }

        monster.attackCooldown = Math.max(0, monster.attackCooldown - delta);
        monster.meleeCooldown = Math.max(0, monster.meleeCooldown - delta);

        if (monster.pendingHitElapsed > 0) {
          monster.pendingHitElapsed = Math.max(0, monster.pendingHitElapsed - delta);
          if (monster.pendingHitElapsed === 0) {
            hitMonster(monster.pendingHitDirection);
          }
        }
        if (monster.dead) return;

        const playerCenter = player.x + player.width / 2;
        const monsterCenter = monster.x + monster.width / 2;
        const horizontalDistance = playerCenter - monsterCenter;

        if (monster.pendingHitElapsed > 0) {
          monster.mode = "hit";
        } else if (monster.hitElapsed > 0) {
          monster.mode = "hit";
          monster.hitElapsed = Math.max(0, monster.hitElapsed - delta);
          monster.hitPhaseElapsed += delta;
          if (monster.hitPhase === "shake") {
            const progress = Math.min(1, monster.hitPhaseElapsed / MONSTER_SHAKE_DURATION);
            monster.shakeOffsetX = Math.sin(progress * Math.PI * 2 * MONSTER_SHAKE_COUNT)
              * MONSTER_SHAKE_AMPLITUDE;
            if (progress >= 1) {
              monster.shakeOffsetX = 0;
              monster.hitPhase = "knockback";
              monster.hitPhaseElapsed = 0;
            }
          } else if (monster.hitPhase === "knockback") {
            const progress = Math.min(1, monster.hitPhaseElapsed / MONSTER_KNOCKBACK_DURATION);
            const easedProgress = 1 - (1 - progress) ** 3;
            monster.x = monster.hitStartX
              + (monster.hitTargetX - monster.hitStartX) * easedProgress;
            if (progress >= 1) {
              monster.x = monster.hitTargetX;
            }
          }
          if (monster.hitElapsed === 0) {
            monster.mode = "approach";
            monster.hitPhase = "";
            monster.shakeOffsetX = 0;
          }
        } else if (monster.meleeElapsed > 0) {
          monster.meleeElapsed = Math.max(0, monster.meleeElapsed - delta);
          monster.mode = "melee";
        } else if (monster.meleeWindupElapsed > 0) {
          monster.meleeWindupElapsed = Math.max(0, monster.meleeWindupElapsed - delta);
          monster.mode = "meleeWindup";
          if (monster.meleeWindupElapsed === 0) {
            const playerHitbox = getPlayerHitbox();
            const currentMonsterHitbox = getMonsterHitbox();
            const horizontalGap = Math.max(
              0,
              currentMonsterHitbox.x - (playerHitbox.x + playerHitbox.width),
              playerHitbox.x - (currentMonsterHitbox.x + currentMonsterHitbox.width)
            );
            const verticalOverlap = playerHitbox.y < currentMonsterHitbox.y + currentMonsterHitbox.height
              && playerHitbox.y + playerHitbox.height > currentMonsterHitbox.y;
            if (horizontalGap <= MONSTER_MELEE_RANGE && verticalOverlap) {
              monster.meleeElapsed = MONSTER_MELEE_DURATION;
              monster.mode = "melee";
              damagePlayer(MONSTER_DAMAGE, monster.facing);
            } else {
              monster.mode = "approach";
            }
          }
        } else {
          if (monster.mode === "hit") {
            monster.mode = "approach";
          }
          if (horizontalDistance !== 0) {
            monster.facing = Math.sign(horizontalDistance);
          }
          const playerHitbox = getPlayerHitbox();
          const currentMonsterHitbox = getMonsterHitbox();
          const horizontalGap = Math.max(
            0,
            currentMonsterHitbox.x - (playerHitbox.x + playerHitbox.width),
            playerHitbox.x - (currentMonsterHitbox.x + currentMonsterHitbox.width)
          );
          const verticalOverlap = playerHitbox.y < currentMonsterHitbox.y + currentMonsterHitbox.height
            && playerHitbox.y + playerHitbox.height > currentMonsterHitbox.y;
          if (horizontalGap <= MONSTER_MELEE_RANGE && verticalOverlap && monster.meleeCooldown <= 0) {
            monster.meleeWindupElapsed = MONSTER_MELEE_WINDUP;
            monster.meleeCooldown = MONSTER_MELEE_COOLDOWN;
            monster.mode = "meleeWindup";
          } else {
            const distance = Math.abs(horizontalDistance);
            const inAttackRange = distance <= MONSTER_ATTACK_RANGE;
            if (distance < MONSTER_RETREAT_RANGE) {
              monster.mode = "retreat";
              monster.x -= monster.facing * MONSTER_SPEED * delta;
            } else if (!inAttackRange) {
              monster.mode = "approach";
              monster.x += monster.facing * MONSTER_SPEED * delta;
            } else if (monster.mode === "approach" || monster.mode === "retreat") {
              monster.mode = "aim";
              monster.modeElapsed = 0;
              monster.boneThrown = false;
            } else if (monster.mode === "aim") {
              monster.modeElapsed += delta;
              if (monster.modeElapsed >= MONSTER_AIM_DURATION && monster.attackCooldown <= 0) {
                launchBone();
                monster.mode = "throw";
                monster.modeElapsed = 0;
                monster.attackCooldown = MONSTER_ATTACK_COOLDOWN;
              }
            } else if (monster.mode === "throw") {
              monster.mode = "approach";
              monster.modeElapsed = 0;
            }
          }
        }

        monster.x = Math.max(0, Math.min(WORLD_WIDTH - monster.width, monster.x));
        const monsterHitbox = getMonsterHitbox();
        const dashHit = player.dashActiveThisFrame
          && player.dashHitbox
          && overlaps(player.dashHitbox, monsterHitbox);
        if (monster.hitElapsed <= 0 && monster.pendingHitElapsed <= 0 && dashHit) {
          monster.pendingHitElapsed = MONSTER_KNOCKBACK_DELAY;
          monster.pendingHitDirection = player.dashDirection;
          monster.mode = "hit";
          player.dashActiveThisFrame = false;
          player.dashHitbox = null;
        }

        for (const projectile of monster.projectiles) {
          projectile.elapsed = Math.min(projectile.duration, projectile.elapsed + delta);
          const progress = projectile.elapsed / projectile.duration;
          projectile.x = projectile.startX + (projectile.targetX - projectile.startX) * progress;
          projectile.y = projectile.startY
            + (projectile.targetY - projectile.startY) * progress
            - Math.sin(Math.PI * progress) * projectile.arcHeight;
          const hitbox = boneVisibleHitbox(projectile, progress);
          if (overlaps(hitbox, getPlayerHitbox())
            || (isDefenseHeld() && isDefenseEdgeContact(hitbox))) {
            damagePlayer(MONSTER_DAMAGE);
            projectile.elapsed = projectile.duration;
            projectile.hitPlayer = true;
          }
        }
        monster.projectiles = monster.projectiles.filter(
          (projectile) => projectile.elapsed < projectile.duration && !projectile.hitPlayer
        );
      }

      function damagePlayer(amount, knockbackDirection = 0, bossAttack = false) {
        if (gameOver
          || player.hitElapsed > 0
          || player.hp <= 0
          || player.dashInvulnerabilityElapsed > 0) return;
        if (player.defenseBreakElapsed <= 0) {
          if (isDefenseHeld()
            && player.defenseElapsed <= PLAYER_PARRY_WINDOW
            && !player.parryUsed) {
            player.parryUsed = true;
            playSound(parrySound, "패링 소리를 재생하지 못했습니다.");
            if (bossAttack) {
              bossParryStreak += 1;
              if (bossParryStreak >= 5) {
                bossParryStreak = 0;
                bossParryStunElapsed = 3;
                bossParryStunBlinkElapsed = 0;
                spawnBossParryMinions();
              }
            } else {
              bossParryStreak = 0;
            }
            return;
          }
          bossParryStreak = 0;
          if (isDefenseHeld() && player.defenseHp > 0) {
            player.defenseHp = Math.max(0, player.defenseHp - amount);
            if (player.defenseHp === 0) {
              player.defenseBreakElapsed = PLAYER_DEFENSE_BREAK_DURATION;
              player.defenseBreakSoundPlayed = true;
              playSound(defenseBreakSound, "방어 파괴 소리를 재생하지 못했습니다.");
              player.defenseEffectElapsed = 0;
              releaseInputKeys("x", "X");
              player.vx = 0;
              player.dashElapsed = 0;
              player.dashActiveThisFrame = false;
              player.dashHitbox = null;
              player.hitElapsed = PLAYER_DEFENSE_BREAK_DURATION;
              player.hitPhase = "shake";
              player.hitPhaseElapsed = 0;
              player.hitDirection = knockbackDirection;
              player.hitStartX = player.x;
              player.hitTargetX = Math.max(
                0,
                Math.min(
                  WORLD_WIDTH - player.width,
                  player.x + knockbackDirection * MONSTER_KNOCKBACK_DISTANCE
                )
              );
              player.shakeOffsetX = 0;
            } else {
              playSound(defenseSound, "방어 소리를 재생하지 못했습니다.", 0.8);
            }
            return;
          }
        }
        bossParryStreak = 0;
        player.hp = Math.max(0, player.hp - amount);
        playSound(damagedSound, "피격 소리를 재생하지 못했습니다.");
        if (player.hp === 0) {
          gameOver = true;
          clearInputKeys();
          gameOverOverlay.hidden = false;
          return;
        }
        if (knockbackDirection !== 0) {
          player.hitElapsed = MONSTER_HIT_DURATION;
          player.hitPhase = "shake";
          player.hitPhaseElapsed = 0;
          player.hitDirection = knockbackDirection;
          player.hitStartX = player.x;
          player.hitTargetX = Math.max(
            0,
            Math.min(
              WORLD_WIDTH - player.width,
              player.x + knockbackDirection * MONSTER_KNOCKBACK_DISTANCE
            )
          );
          player.shakeOffsetX = 0;
        } else {
          player.hitElapsed = 0.3;
        }
      }

      function update(delta) {
        if (gameOver) return;
        const targetNightLevel = boss.active && !boss.defeated ? 1 : 0;
        const nightBlend = Math.min(1, delta / BOSS_NIGHT_TRANSITION_DURATION);
        bossNightLevel += (targetNightLevel - bossNightLevel) * nightBlend;
        player.dashCooldown = Math.max(0, player.dashCooldown - delta);
        player.dashInvulnerabilityElapsed = Math.max(
          0,
          player.dashInvulnerabilityElapsed - delta
        );
        player.defenseElapsed += delta;
        if (!isDefenseHeld()) {
          player.defenseEffectElapsed = Math.min(
            PLAYER_DEFENSE_EFFECT_DURATION,
            player.defenseEffectElapsed + delta
          );
        }
        player.defenseBreakElapsed = Math.max(0, player.defenseBreakElapsed - delta);
        if (player.defenseHp < PLAYER_MAX_DEFENSE_HP
          && player.defenseBreakElapsed === 0
          && !isDefenseHeld()) {
          player.defenseHp = Math.min(
            PLAYER_MAX_DEFENSE_HP,
            player.defenseHp + PLAYER_DEFENSE_REGEN * delta
          );
        }
        player.hitElapsed = Math.max(0, player.hitElapsed - delta);
        if (player.hitPhase !== "") {
          player.hitPhaseElapsed += delta;
          if (player.hitPhase === "shake") {
            const progress = Math.min(1, player.hitPhaseElapsed / MONSTER_SHAKE_DURATION);
            player.shakeOffsetX = Math.sin(progress * Math.PI * 2 * MONSTER_SHAKE_COUNT)
              * MONSTER_SHAKE_AMPLITUDE;
            if (progress >= 1) {
              player.shakeOffsetX = 0;
              player.hitPhase = "knockback";
              player.hitPhaseElapsed = 0;
            }
          } else if (player.hitPhase === "knockback") {
            const progress = Math.min(1, player.hitPhaseElapsed / MONSTER_KNOCKBACK_DURATION);
            const easedProgress = 1 - (1 - progress) ** 3;
            player.x = player.hitStartX
              + (player.hitTargetX - player.hitStartX) * easedProgress;
            if (progress >= 1) {
              player.x = player.hitTargetX;
              player.hitPhase = "";
              player.hitPhaseElapsed = 0;
              player.shakeOffsetX = 0;
            }
          }
        }
        player.dropThroughElapsed = Math.max(0, player.dropThroughElapsed - delta);
        player.dashActiveThisFrame = false;
        player.dashHitbox = null;
        for (const effect of player.slowEffects) {
          effect.age += delta;
        }
        player.slowEffects = player.slowEffects.filter((effect) => effect.age < SLOW_EFFECT_FADE_DURATION);
        const playerHitStopped = player.hitStopElapsed > 0;
        const playerHitReacting = player.hitPhase !== "";
        if (playerHitStopped || playerHitReacting) {
          player.hitStopElapsed = Math.max(0, player.hitStopElapsed - delta);
          player.vx = 0;
          if (!player.grounded) {
            player.vy += (player.vy >= 0 ? PLAYER_FALL_GRAVITY : GRAVITY) * delta;
            player.y += player.vy * delta;
          }
        } else {
          handleInput();

          if (player.dashElapsed > 0) {
            const previousDashX = player.x;
            player.dashElapsed = Math.min(DASH_TIME, player.dashElapsed + delta);
            const progress = player.dashElapsed / DASH_TIME;
            player.x = player.dashStartX + player.dashDirection * DASH_DISTANCE * progress;
            const segmentStart = Math.min(previousDashX, player.x);
            player.dashHitbox = {
              x: segmentStart,
              y: player.y,
              width: Math.abs(player.x - previousDashX) + player.width,
              height: player.height
            };
            player.dashActiveThisFrame = true;
            player.vx = 0;
            player.dashEffectElapsed += delta;
            while (player.slowBurstCount < 3 && player.dashElapsed >= (player.slowBurstCount + 1) * 0.1) {
              const burstTime = (player.slowBurstCount + 1) * 0.1;
              const effectX = player.dashStartX
                + player.dashDirection * DASH_DISTANCE * (burstTime / DASH_TIME);
              if (isStandingAt(effectX, player.y)) {
                const effectWidth = BLOCK * 0.8 * EFFECT_SCALE * 2;
                const artCenterX = player.dashDirection > 0
                  ? SLOW_EFFECT_ART_CENTER_X
                  : 1 - SLOW_EFFECT_ART_CENTER_X;
                player.slowEffects.push({
                  x: effectX + player.width / 2 - effectWidth * artCenterX,
                  groundY: player.y + player.height,
                  facing: player.dashDirection,
                  age: player.dashElapsed - burstTime
                });
              }
              player.slowBurstCount += 1;
            }
            if (player.dashElapsed >= DASH_TIME) {
              player.dashElapsed = 0;
              player.dashCooldown = DASH_COOLDOWN;
              player.dashInvulnerabilityElapsed = DASH_INVULNERABILITY_DURATION;
              player.dashEffectElapsed = 0.000001;
              player.slowElapsed = 0.000001;
              player.slowMovementElapsed = 0;
            }
          } else {
            if (player.slowElapsed > 0 && player.slowMovementElapsed < DASH_RECOVERY_DURATION) {
              const recoveryDelta = Math.min(delta, DASH_RECOVERY_DURATION - player.slowMovementElapsed);
              player.x += player.dashDirection * DASH_RECOVERY_SPEED * recoveryDelta;
              player.slowMovementElapsed += recoveryDelta;
            } else {
              player.x += player.vx * delta;
            }
            if (player.slowElapsed > 0) {
              player.slowElapsed += delta;
              if (player.slowElapsed >= SLOW_EFFECT_DURATION) {
                player.slowElapsed = 0;
                player.dashEffectElapsed = 0;
              }
            }
            if (!player.grounded) {
              player.vy += (player.vy >= 0 ? PLAYER_FALL_GRAVITY : GRAVITY) * delta;
              player.y += player.vy * delta;
            }
          }
        }

        player.x = Math.max(0, Math.min(WORLD_WIDTH - player.width, player.x));
        const floor = floorY();
        if (player.y + player.height >= floor) {
          player.y = floor - player.height;
          player.vy = 0;
          player.grounded = true;
        } else if (player.dashElapsed > 0 || playerHitStopped || playerHitReacting) {
          player.grounded = isStandingOnSurface();
        } else {
          player.grounded = false;
          if (player.vy >= 0 && player.dropThroughElapsed === 0) {
            for (const platform of levelPlatforms) {
              const overlaps = player.x + player.width > platform.x
                && player.x < platform.x + platform.width;
              const wasAbove = player.y + player.height - player.vy * delta <= platform.y;
              if (overlaps && wasAbove && player.y + player.height >= platform.y) {
                player.y = platform.y - player.height;
                player.vy = 0;
                player.grounded = true;
                break;
              }
            }
          }
        }
        updateMonster(delta);
        updateBoss(delta);
        updateBossParryMinions(delta);
        updatePattern6(delta);
        const dashOffset = player.dashElapsed > 0
          ? player.dashDirection * DASH_CAMERA_OFFSET
          : 0;
        const targetCameraX = Math.max(
          0,
          Math.min(
            WORLD_WIDTH - viewWidth,
            player.x + player.width / 2 - (viewWidth / 2 + dashOffset)
          )
        );
        const smoothing = player.dashElapsed > 0
          ? DASH_CAMERA_SMOOTHING
          : CAMERA_RETURN_SMOOTHING;
        const cameraBlend = 1 - Math.exp(-delta / smoothing);
        if (player.hitStopElapsed > 0) {
          cameraX = Math.max(0, Math.min(WORLD_WIDTH - viewWidth, cameraX));
        } else if (player.dashElapsed > 0) {
          cameraX = targetCameraX;
        } else {
          cameraX += (targetCameraX - cameraX) * cameraBlend;
        }
      }

      function drawBackground() {
        const floor = floorY();
        const nightGradient = context.createLinearGradient(0, 0, 0, floor);
        nightGradient.addColorStop(0, "#071126");
        nightGradient.addColorStop(1, "#263650");
        context.fillStyle = nightGradient;
        context.fillRect(0, 0, viewWidth, floor);

        context.save();
        context.globalAlpha = 1 - bossNightLevel;
        context.fillStyle = backgroundGradient;
        context.fillRect(0, 0, viewWidth, floor);

        const cloudUnit = BLOCK / 2;
        context.globalAlpha *= 0.48;
        context.fillStyle = "#f4fbfc";
        for (let index = 0; index < 18; index++) {
          const worldX = index * BLOCK * 12 + (index % 3) * cloudUnit * 2;
          const screenX = worldX - cameraX * 0.25;
          const y = 44 + (index * 47) % 150;
          if (screenX > viewWidth || screenX + cloudUnit * 6 < 0) continue;
          context.fillRect(screenX + cloudUnit, y + cloudUnit, cloudUnit * 3, cloudUnit);
          context.fillRect(screenX, y + cloudUnit * 2, cloudUnit * 5, cloudUnit);
          context.fillRect(screenX + cloudUnit * 2, y, cloudUnit * 2, cloudUnit);
          context.fillRect(screenX + cloudUnit * 5, y + cloudUnit * 2, cloudUnit, cloudUnit);
        }
        context.restore();

        for (let index = 0; index < 19; index++) {
          const worldX = index * BLOCK * 11;
          const width = BLOCK * (3 + index % 3);
          const screenX = worldX - cameraX * 0.65;
          if (screenX + width < 0 || screenX > viewWidth) continue;
          const buildingTop = floor - BLOCK * 8;
          context.fillStyle = ["#89999c", "#829296", "#909d9e"][index % 3];
          context.fillRect(screenX, buildingTop, width, floor - buildingTop);
        }
        if (bossNightLevel > 0.001) {
          context.fillStyle = `rgba(5, 10, 28, ${bossNightLevel * 0.22})`;
          context.fillRect(0, 0, viewWidth, floor);

          context.save();
          context.globalAlpha = bossNightLevel * 0.75;
          context.fillStyle = "#e7f0ff";
          for (let index = 0; index < 36; index += 1) {
            const x = (index * 197 + 31) % Math.max(1, viewWidth);
            const y = (index * 83 + 17) % Math.max(1, Math.floor(floor * 0.78));
            const size = index % 7 === 0 ? 2 : 1;
            context.fillRect(x, y, size, size);
          }
          context.restore();
        }
      }

      function drawPlatforms() {
        const floor = floorY();
        context.fillStyle = "#3b4146";
        context.fillRect(-cameraX, floor, WORLD_WIDTH, viewHeight - floor);
        context.fillStyle = "#555d63";
        for (const platform of levelPlatforms) {
          const screenX = platform.x - cameraX;
          if (screenX + platform.width < 0 || screenX > viewWidth) continue;
          context.fillRect(screenX, platform.y, platform.width, platform.height);
          context.fillStyle = "#727b81";
          context.fillRect(screenX, platform.y, platform.width, 3);
          context.fillStyle = "#555d63";
        }
      }

      function drawImageSprite(image, x, y, width, height, alpha = 1, facing = 1) {
        if (!image.complete || !image.naturalWidth) return;
        context.save();
        context.globalAlpha = alpha;
        if (facing < 0) {
          context.translate(x + width, y);
          context.scale(-1, 1);
          context.drawImage(image, 0, 0, width, height);
        } else {
          context.drawImage(image, x, y, width, height);
        }
        context.restore();
      }

      function drawSprite(index, x, y, width, height, alpha = 1, facing = 1) {
        drawImageSprite(sprites[index], x, y, width, height, alpha, facing);
      }

      function drawMonster() {
        const monsterAlpha = monster.dead
          ? Math.max(0, 1 - monster.deathElapsed / MONSTER_DEATH_FADE_DURATION)
          : 1;
        if (monsterAlpha <= 0) return;
        const screenX = monster.x + monster.shakeOffsetX - cameraX;
        const monsterSpriteY = monster.y + monster.height * (1 - SPRITE_VISIBLE_BOTTOM);
        const monsterFrame = monster.dead || monster.hitElapsed > 0 ? 3 : 0;
        const monsterSpriteFacing = monsterFrame === 0 ? -monster.facing : monster.facing;

        if (!monster.dead && monster.mode === "aim" && monster.hitElapsed <= 0 && !monster.boneThrown) {
          const heldBone = heldBonePosition(screenX, monster.y);
          drawImageSprite(
            monsterSprites[1],
            heldBone.x,
            heldBone.y,
            heldBone.size,
            heldBone.size,
            1,
            monster.facing
          );
        }

        drawImageSprite(
          monsterSprites[monsterFrame],
          screenX,
          monsterSpriteY,
          monster.width,
          monster.height,
          monsterAlpha,
          monsterSpriteFacing
        );

        if (monster.meleeElapsed > 0) {
          const progress = 1 - monster.meleeElapsed / MONSTER_MELEE_DURATION;
          const pivotX = screenX + monster.width * (monster.facing > 0 ? 0.72 : 0.28);
          const pivotY = monsterSpriteY + monster.height * 0.52;
          context.save();
          context.translate(pivotX, pivotY);
          if (monster.facing < 0) context.scale(-1, 1);
          context.rotate((progress - 0.5) * Math.PI * 1.2);
          context.drawImage(monsterSprites[1], BLOCK * 0.15, -BLOCK, BLOCK * 2, BLOCK * 2);
          context.restore();
        }

        for (const projectile of monster.projectiles) {
          const progress = projectile.elapsed / projectile.duration;
          context.save();
          context.translate(projectile.x - cameraX, projectile.y);
          context.rotate(projectileRotation(projectile, progress));
          context.drawImage(monsterSprites[2], -BLOCK, -BLOCK, BLOCK * 2, BLOCK * 2);
          context.restore();
        }
      }

      function drawBoss() {
        if (!boss.active || boss.defeated) return;
        if (boss.pattern === "pattern2" && boss.step !== "pattern2-leap") return;
        if (bossParryStunElapsed > 0
          && Math.floor(bossParryStunBlinkElapsed / BOSS_PARRY_STUN_BLINK_INTERVAL) % 2 === 1) {
          return;
        }
        const x = boss.x - cameraX;
        const y = boss.y;
        const image = bossSprites[boss.spriteIndex];
        drawImageSprite(
          image,
          x - BOSS_SIZE / 2,
          y - BOSS_SIZE / 2,
          BOSS_SIZE,
          BOSS_SIZE,
          1,
          boss.facing
        );
      }

      function drawBossSpear() {
        if (!boss.active || boss.defeated || boss.pattern === "pattern2") return;
        if (bossParryStunElapsed > 0
          && Math.floor(bossParryStunBlinkElapsed / BOSS_PARRY_STUN_BLINK_INTERVAL) % 2 === 1) {
          return;
        }
        const attacking = boss.step === "barrage" && bossSpearAttack;
        const elapsed = attacking ? bossSpearAttack.elapsed : 0;
        const thrustProgress = attacking
          ? Math.min(1, elapsed / BOSS04_THRUST_DURATION)
          : 0;
        const fadeProgress = attacking && BOSS04_ATTACK_INTERVAL > BOSS04_THRUST_DURATION
          ? Math.max(
            0,
            (elapsed - BOSS04_THRUST_DURATION)
              / (BOSS04_ATTACK_INTERVAL - BOSS04_THRUST_DURATION)
          )
          : 0;
        const image = bossSprites[attacking ? 5 : 4];
        const x = boss.x
          + boss.facing * (BLOCK * 0.25 + BOSS04_THRUST_DISTANCE * thrustProgress)
          - BOSS_SIZE / 2
          - cameraX;
        const y = boss.y
          + (attacking ? bossSpearAttack.verticalOffset : 0)
          - BOSS_SIZE / 2;
        drawImageSprite(
          image,
          x,
          y,
          BOSS_SIZE,
          BOSS_SIZE,
          1 - fadeProgress,
          -boss.facing
        );
      }

      function drawRotatedBossSprite(image, centerX, centerY, angle, alpha = 1) {
        if (!image.complete || !image.naturalWidth) return;
        context.save();
        context.globalAlpha = alpha;
        context.translate(centerX - cameraX, centerY);
        context.rotate(angle);
        context.drawImage(
          image,
          -BOSS_SIZE / 2,
          -BOSS_SIZE / 2,
          BOSS_SIZE,
          BOSS_SIZE
        );
        context.restore();
      }

      function drawBoss17WaveTile(tile, groundY) {
        const elapsed = tile.elapsed;
        if (elapsed < 0 || elapsed >= BOSS_PATTERN_TWO_WAVE_LIFETIME
          || !boss17Sprite.complete || !boss17Sprite.naturalWidth) return;
        const scale = elapsed < BOSS17_GROW_DURATION
          ? 0.5 + 0.5 * (elapsed / BOSS17_GROW_DURATION)
          : 1;
        const alpha = elapsed < BOSS17_FADE_START
          ? 1
          : Math.max(0, 1 - (elapsed - BOSS17_FADE_START) / BOSS17_FADE_DURATION);
        const imageHeight = BOSS17_WAVE_TILE_HEIGHT * scale;
        context.save();
        context.globalAlpha = alpha;
        context.drawImage(
          boss17Sprite,
          BOSS17_VISIBLE_LEFT * 1024,
          BOSS17_VISIBLE_TOP * 1024,
          (BOSS17_VISIBLE_RIGHT - BOSS17_VISIBLE_LEFT) * 1024,
          (BOSS17_VISIBLE_BOTTOM - BOSS17_VISIBLE_TOP) * 1024,
          tile.x - BOSS17_WAVE_TILE_WIDTH / 2 - cameraX,
          groundY - imageHeight,
          BOSS17_WAVE_TILE_WIDTH,
          imageHeight
        );
        context.restore();
      }

      function drawBossPatternTwo() {
        if (!bossPatternTwo) return;
        if (boss.step === "pattern2-aim") {
          drawImageSprite(
            bossSprites[3],
            bossPatternTwo.targetX - BOSS_SIZE / 2 - cameraX,
            bossPatternTwo.targetY - BOSS_SIZE / 2,
            BOSS_SIZE,
            BOSS_SIZE
          );
          drawRotatedBossSprite(
            bossSprites[4],
            bossPatternTwo.targetX
              + BOSS_SIZE * (BOSS03_VISIBLE_LEFT - BOSS04_VISIBLE_BOTTOM),
            bossPatternTwo.targetY,
            -Math.PI / 2
          );
        } else if (boss.step === "pattern2-dive") {
          const progress = Math.min(
            1,
            bossPatternTwo.elapsed / BOSS_PATTERN_TWO_DIVE_DURATION
          );
          const diveX = bossPatternTwo.diveStartX
            + (bossPatternTwo.diveEndX - bossPatternTwo.diveStartX) * progress;
          const diveY = bossPatternTwo.diveStartY
            + (bossPatternTwo.diveEndY - bossPatternTwo.diveStartY) * progress;
          drawRotatedBossSprite(
            bossSprites[4],
            diveX,
            diveY,
            -2 * Math.PI / 3
          );
        } else if (boss.step === "pattern2-impact") {
          for (const pair of bossPatternTwo.wavePairs) {
            for (const tile of pair.tiles) {
              drawBoss17WaveTile(tile, bossPatternTwo.groundY);
            }
          }
        }
      }

      function drawPattern6() {
        if (!pattern6) return;
        if (pattern6.phase === "target" || pattern6.phase === "strike" || pattern6.phase === "fade") {
          const alpha = pattern6.phase === "fade"
            ? Math.max(0, 1 - pattern6.elapsed / PATTERN_BOSS_FADE_DURATION)
            : 1;
          for (const boss of pattern6.bosses) {
            const image = patternBossSprites[boss.spriteIndex];
            drawImageSprite(
              image,
              boss.x + (boss.shakeOffsetX || 0) - PATTERN_BOSS_SIZE / 2 - cameraX,
              boss.y - PATTERN_BOSS_SIZE / 2,
              PATTERN_BOSS_SIZE,
              PATTERN_BOSS_SIZE,
              alpha
            );
          }
          return;
        }

        const alpha = Math.min(
          1,
          (PATTERN_BOSS12_DURATION - pattern6.elapsed) / PATTERN_BOSS12_FADE_DURATION
        );
        const anchorX = pattern6.originX - cameraX;
        const anchorY = floorY();
        context.save();
        context.globalAlpha = Math.max(0, alpha);
        context.translate(anchorX, anchorY);
        context.rotate(-pattern6.elapsed * PATTERN_BOSS12_ROTATION_SPEED);
        const image = patternBossSprites[0];
        if (image.complete && image.naturalWidth) {
          context.drawImage(
            image,
            -PATTERN_BOSS_SIZE / 2,
            -PATTERN_BOSS_SIZE * PATTERN_BOSS12_COLOR_BOTTOM,
            PATTERN_BOSS_SIZE,
            PATTERN_BOSS_SIZE
          );
        }
        context.restore();
      }

      function drawPlayer() {
        const screenX = player.x + player.shakeOffsetX - cameraX;
        const dashActive = player.dashElapsed > 0;
        const slowActive = player.slowElapsed > 0;
        let playerState = player.hitElapsed > 0 ? 1 : 0;
        if (dashActive) playerState = 2;
        else if (slowActive && player.grounded) playerState = 3;

        for (const effect of player.slowEffects) {
          const effectWidth = BLOCK * 0.8 * EFFECT_SCALE * 2;
          const effectHeight = BLOCK * 0.8 * EFFECT_SCALE * 2;
          drawSprite(
            5,
            effect.x - cameraX,
            effect.groundY - effectHeight * SPRITE_VISIBLE_BOTTOM,
            effectWidth,
            effectHeight,
            1 - effect.age / SLOW_EFFECT_FADE_DURATION,
            effect.facing
          );
        }

        const playerSpriteY = player.y + player.height * (1 - SPRITE_VISIBLE_BOTTOM);
        drawSprite(playerState, screenX, playerSpriteY, player.width, player.height, 1, player.facing);

        if (player.defenseBreakElapsed > 0) {
          const progress = 1 - player.defenseBreakElapsed / PLAYER_DEFENSE_BREAK_EFFECT_DURATION;
          const shieldHitbox = getDefenseShieldHitbox();
          drawImageSprite(
            defenseSprites[1],
            shieldHitbox.x - cameraX,
            shieldHitbox.y,
            shieldHitbox.width,
            shieldHitbox.height,
            0.5 * (1 - progress)
          );
          if (defenseSprites[1].complete
            && defenseSprites[1].naturalWidth
            && !player.defenseBreakSoundPlayed) {
            player.defenseBreakSoundPlayed = true;
            playSound(defenseBreakSound, "방어 파괴 소리를 재생하지 못했습니다.");
          }
        } else if (isDefenseHeld() || player.defenseEffectElapsed < PLAYER_DEFENSE_EFFECT_DURATION) {
          const shieldHitbox = getDefenseShieldHitbox();
          drawImageSprite(
            defenseSprites[0],
            shieldHitbox.x - cameraX,
            shieldHitbox.y,
            shieldHitbox.width,
            shieldHitbox.height,
            isDefenseHeld()
              ? 0.5
              : 0.5 * (1 - player.defenseEffectElapsed / PLAYER_DEFENSE_EFFECT_DURATION)
          );
        }

        if (dashActive) {
          const alpha = Math.max(0, 1 - player.dashEffectElapsed / 0.3);
          const effectHeight = player.height;
          drawSprite(4, player.dashEffectX - cameraX, player.dashEffectGroundY - effectHeight * SPRITE_VISIBLE_BOTTOM, player.width, effectHeight, alpha, player.facing);
        }
      }

      function draw() {
        drawBackground();
        drawPlatforms();
        drawMonster();
        for (const minion of bossParryMinions) {
          drawImageSprite(
            monsterSprites[0],
            minion.x - cameraX,
            minion.y + MONSTER_SIZE * (1 - SPRITE_VISIBLE_BOTTOM),
            MONSTER_SIZE,
            MONSTER_SIZE,
            1,
